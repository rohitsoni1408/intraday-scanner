name: RS1408 Market Alert Bot

on:
  schedule:
    # Runs every 15 mins Mon-Fri during Indian Market Hours (9:15 AM - 3:30 PM IST)
    - cron: '35-55/15 3-9 * * 1-5'
  workflow_dispatch: # Allows manual testing from the GitHub Actions tab

jobs:
  run-alert-bot:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.10'

        - name: Install dependencies
          run: pip install pandas requests yfinance

        - name: Run Alert Script
          env:
            TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
            TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          run: python alert_bot.py
