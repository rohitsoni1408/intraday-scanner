name: NSE Intraday Bot Scanner

on:
  schedule:
    # Runs every 15 minutes, Monday through Friday, from 03:45 UTC to 10:00 UTC 
    # (Matches 9:15 AM to 3:30 PM Indian Standard Time)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch: # Enables the "Run workflow" button in the Actions tab

jobs:
  scanner:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Intraday Alert Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python alert_bot.py
