name: NSE Intraday Bot Scanner

on:
  schedule:
    # Runs every 5 minutes from 9:15 AM to 3:30 PM IST (Mon-Fri)
    # Cron uses UTC time: 9:15 AM IST = 3:45 AM UTC
    - cron: '45 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install pandas yfinance requests

      - name: Run Intraday Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alert_bot.py
